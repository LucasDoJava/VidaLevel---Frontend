<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <filter id="shadow" x="-0.2" y="-0.2" width="1.4" height="1.4">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Fundo gradiente com bordas arredondadas -->
  <rect width="40" height="40" rx="12" fill="url(#gradient)" filter="url(#shadow)"/>
  
  <!-- Texto VL centralizado -->
  <text x="20" y="28" text-anchor="middle" fill="white" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="700" font-size="20" letter-spacing="1">
    VL
  </text>
</svg>